<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSEDA — Muy pronto</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050b09">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#050b09;--line2:rgba(214,240,226,.16);--text:#e8efe9;--muted:#8ea39a;--lime:#c6f25e;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Geist","Inter",-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(60% 50% at 50% 0%,rgba(198,242,94,.08),transparent 70%)}
a{color:inherit;text-decoration:none}
main{max-width:520px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:600;letter-spacing:.22em;font-size:14px;margin-bottom:44px}
.brand svg{width:28px;height:28px}
.geo{font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;letter-spacing:0;color:var(--lime);margin-right:.08em}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:18px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.08;font-weight:500;letter-spacing:-.02em;margin-bottom:16px}
h1 .it{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--lime)}
p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:12px 20px;border-radius:999px;
  background:var(--lime);color:#0a1404;transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x=".75" y=".75" width="30.5" height="30.5" rx="9" stroke="rgba(214,240,226,.25)" stroke-width="1.5"/>
      <path d="M8.5 19.5c2-6.5 6.5-9.5 12-8.8 3.6.5 4.6 3.6 2.4 5.6-2.6 2.3-7.4 1.2-9.6 4.2" stroke="#c6f25e" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11.5 22.5c1.5-4.2 4.6-6.2 8.2-5.8" stroke="rgba(198,242,94,.55)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M6.5 15c2.8-6.6 8.3-9.9 14.6-8.9" stroke="rgba(198,242,94,.3)" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span><span class="geo">geo</span>SEDA</span>
  </a>
  <div class="kicker">Muy pronto</div>
  <h1>La plataforma abre <span class="it">en este mismo sitio.</span></h1>
  <p>Estamos preparando la entrada y la creación de cuentas de GeoSEDA para consultoras y equipos SIG.</p>
  <a class="btn" href="/">Volver al inicio <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
